<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO-метатеги для главной страницы -->
    <title>Путь к Рулю — Обучение в автошколе онлайн</title>
    <meta name="description" content="Удобная запись на занятия, онлайн-теория, билеты ПДД и контроль прогресса — всё в одном приложении. Начни свой путь к правам прямо сейчас!">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Путь к Рулю — Обучение в автошколе онлайн">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/">
    <meta property="og:description" content="Удобная запись на занятия, онлайн-теория, билеты ПДД и контроль прогресса.">

    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Шапка сайта */
        header {
            background-color: #1a1a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #f5a623;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: #a8b2c9;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: white;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-login {
            background: transparent;
            border: 1px solid #f5a623;
            color: #f5a623;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-login:hover {
            background: #f5a623;
            color: #1a1a2e;
        }

        .btn-register {
            background: #f5a623;
            border: none;
            color: #1a1a2e;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-register:hover {
            background: #e0951a;
        }

        /* Главный баннер */
        .hero {
            background: linear-gradient(135deg, #2a1b5e 0%, #3d2a8a 40%, #1e3a8a 100%);
            min-height: calc(100vh - 65px); /* Высота экрана минус шапка */
            display: flex;
            align-items: center;
            padding: 0 40px;
            color: white;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 50px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 48px;
            line-height: 1.2;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: #f5a623;
        }

        .hero-text p {
            font-size: 16px;
            color: #c7d2e3;
            line-height: 1.5;
            margin-bottom: 40px;
            max-width: 500px;
        }

        /* Кнопки магазинов приложений */
        .app-buttons {
            display: flex;
            gap: 20px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .app-btn:hover {
            transform: translateY(-3px);
        }

        .app-btn svg {
            width: 32px;
            height: 32px;
        }

        /* Картинка справа */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Адаптивность для телефонов */
        @media (max-width: 900px) {
            .hero-container {
                flex-direction: column;
                text-align: center;
                padding-top: 40px;
            }
            nav ul {
                display: none; /* Скрываем меню на телефонах */
            }
            .hero-text h1 {
                font-size: 32px;
            }
            .hero-text p {
                margin: 0 auto 30px auto;
            }
            .app-buttons {
                justify-content: center;
            }
            .hero-image img {
                margin-top: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">
            🚗 Путь к <span>Рулю</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Расписание</a></li>
                <li><a href="#">Обучение</a></li>
                <li><a href="#">Инструкторы</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <!-- Кнопка Войти тоже ведет на страницу регистрации (пока) -->
            <a href="register.html" class="btn-login">Войти</a>
            <!-- Кнопка Регистрация ведет на вашу форму -->
            <a href="register.html" class="btn-register">Регистрация</a>
        </div>
    </header>

    <!-- Главный блок -->
    <main class="hero">
        <div class="hero-container">
            
            <div class="hero-text">
                <h1>Твой путь к <br><span>водительским правам</span><br> начинается здесь</h1>
                <p>Удобная запись, онлайн-теория, билеты ПДД и контроль прогресса — всё в одном приложении. Скачай и начни учиться прямо сейчас!</p>
                
                <div class="app-buttons">
                    <!-- Ссылки на магазины приложений -->
                    <a href="#" class="app-btn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12L3.84 21.85C3.34 21.6 3 21.09 3 20.5ZM16.81 15.12L6.05 21.34L14.54 12.85L16.81 15.12ZM20.16 10.81C20.5 11.08 20.75 11.5 20.75 12C20.75 12.5 20.53 12.9 20.18 13.18L17.89 14.5L15.39 12L17.89 9.5L20.16 10.81ZM6.05 2.66L16.81 8.88L14.54 11.15L6.05 2.66Z" fill="white"/></svg>
                        Google Play
                    </a>
                    <a href="#" class="app-btn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM11 7H13V13H11V7ZM11 15H13V17H11V15Z" fill="white"/></svg>
                        RuStore
                    </a>
                </div>
            </div>

            <div class="hero-image">
                <!-- Вставьте сюда ссылку на картинку с водителем, как на макете -->
                <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?q=80&w=600&auto=format&fit=crop" alt="Девушка за рулем автомобиля с инструктором">
            </div>

        </div>
    </main>

</body>
</html>
