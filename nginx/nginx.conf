server {
    listen 80;
    server_name put-k-rulyu.localhost;
    return 301 https://$host$request_uri; # Перенаправляем всех с HTTP на HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name put-k-rulyu.localhost;

    # Пути к сертификатам внутри контейнера
    ssl_certificate /etc/nginx/certs/put-k-rulyu.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/put-k-rulyu.localhost-key.pem;

    # Сжатие файлов (для скорости)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Раздача нашего сайта
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}